dependencies:
  # Pinned ESP-IDF release (docs/adr/0001-esp-idf-version.md)
  idf: "==6.1.1"
  # IP101 PHY driver moved out of ESP-IDF in 6.0
  espressif/ip101: "^1.1.0"
  # Wi-Fi through the on-module ESP32-C6 (ESP-Hosted over SDIO)
  espressif/esp_wifi_remote: "^1.6.5"
  espressif/esp_hosted: "^3.1.0"
  # QR code of the gateway EUI for TTN registration (web UI, ADR-0012)
  espressif/qrcode: "^0.2.0"
  # lorawan-gateway-xxxxxx.local for the web UI (ADR-0013)
  espressif/mdns: "^1.15.1"
  # BLE Wi-Fi provisioning (ESP BLE Provisioning app), NimBLE over ESP-Hosted HCI (ADR-0014)
  espressif/network_provisioning: "^1.0.0"
  # LoRa Basics Station LNS link to TTN over a TLS WebSocket (ADR-0016)
  espressif/esp_websocket_client: "^1.8.0"
  # MQTT to Home Assistant (ADR-0018); esp-mqtt left ESP-IDF in 6.0
  espressif/mqtt: "^1.1.0"
